
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Én Việt Group | Đăng nhập</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{background:#07549a;color:#103566}
.page{
 min-height:100vh;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:flex-end;
 padding:45px 5%;
 background-image:url("./nen_sanbay_enviet_moi.jpg");
 background-size:cover;
 background-repeat:no-repeat;
 background-position:center center;
}
.page:before{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(90deg,rgba(0,28,62,.03),rgba(0,30,65,.09));
 pointer-events:none;
}
.brand{
 position:absolute;
 left:5%;
 top:9%;
 z-index:1;
 color:white;
 text-shadow:0 2px 14px #00345b99;
}
.brand h2{font-size:28px;margin:0 0 10px}
.brand span,.logo span{color:#ff8200}
.brand p{font-size:13px;letter-spacing:2px;line-height:1.8;margin:0}
.panel{
 position:relative;
 z-index:2;
 width:400px;
 max-width:100%;
 flex-shrink:0;
 background:rgba(255,255,255,.97);
 padding:29px 30px 26px;
 border-radius:20px;
 box-shadow:0 16px 55px #002f5a44;
 text-align:center;
}
.bird{width:85px;height:67px;display:block;margin:0 auto 8px}
.logo{
 font-size:25px;
 color:#07549a;
 font-weight:800;
 margin:0;
}
.subtitle{
 font-size:11px;
 letter-spacing:2px;
 font-weight:bold;
 margin:12px 0 19px;
}
.rule{width:65px;height:3px;background:#ff8200;margin:0 auto 22px}
h3{font-size:21px;margin:0 0 22px}
.field{
 width:100%;
 height:51px;
 margin-bottom:13px;
 border:1px solid #cad7e4;
 background:white;
 border-radius:9px;
 font-size:15px;
 padding:0 15px;
}
.field:focus{outline:2px solid #8ac5ed}
.password-box{position:relative}
.password-box input{padding-right:65px}
.show{
 position:absolute;
 right:9px;
 top:10px;
 padding:7px;
 border:0;
 background:none;
 color:#557591;
 cursor:pointer;
}
.submit{
 width:100%;
 padding:16px;
 border:0;
 border-radius:9px;
 background:linear-gradient(90deg,#ff950c,#ff5900);
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
 margin-top:2px;
}
.submit:disabled{opacity:.65;cursor:wait}
#message{font-size:13px;min-height:18px;line-height:1.5}
.foot{
 margin-top:14px;
 padding-top:15px;
 border-top:1px solid #dce5ed;
 font-size:12px;
 color:#6c7f91;
}
@media(max-width:700px){
 .page{
  justify-content:center;
  padding:25px 15px;
  background-position:35% center;
 }
 .brand{display:none}
 .panel{width:min(100%,390px);padding:25px 21px}
}
</style>
</head>
<body>

<div class="page">

<div class="brand">
 <h2>ÉN VIỆT <span>GROUP</span></h2>
 <p>KẾT NỐI BẦU TRỜI VIỆT</p>
 <p>VƯƠN TỚI THẾ GIỚI</p>
</div>

<main class="panel">

<svg class="bird" viewBox="0 0 120 90"
role="img" aria-label="Biểu tượng chim én">
<path fill="#ff8608" d="M7 11 Q40 32 73 44 Q49 46 30 32 Q47 53 73 54 Q48 60 30 49 Q48 69 77 64 Q43 77 25 59 Q53 87 84 65"/>
<path fill="#0666b8" d="M73 44 Q93 30 108 43 Q113 48 116 45 Q112 55 103 54 Q92 83 46 83 Q79 70 73 44Z"/>
</svg>

<h1 class="logo">ÉN VIỆT <span>GROUP</span></h1>
<p class="subtitle">CỔNG THANH TOÁN TRỰC TUYẾN</p>
<div class="rule"></div>
<h3>Đăng nhập quản trị</h3>

<form id="loginForm">
<input class="field" id="email" type="email"
placeholder="Email" autocomplete="username"
aria-label="Email" required>

<div class="password-box">
<input class="field" id="password"
type="password" placeholder="Mật khẩu"
autocomplete="current-password"
aria-label="Mật khẩu" required>
<button class="show" id="showPassword"
type="button">Hiện</button>
</div>

<button class="submit" id="loginBtn" type="submit">
ĐĂNG NHẬP →
</button>
</form>

<p id="message" role="status"></p>
<div class="foot">
Chỉ dành cho nhân viên được cấp quyền
</div>

</main>
</div>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyDCbesOqPohbh8R5N42l7z6h3T8Coipa8o",
 authDomain:"enviet-payment-center.firebaseapp.com",
 projectId:"enviet-payment-center",
 storageBucket:"enviet-payment-center.firebasestorage.app",
 messagingSenderId:"995803196860",
 appId:"1:995803196860:web:623863bdf426b079ac0fb9",
 measurementId:"G-2DVDS6V976"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const $=id=>document.getElementById(id);

$("showPassword").onclick=()=>{
 const field=$("password");
 const visible=field.type==="password";
 field.type=visible?"text":"password";
 $("showPassword").textContent=visible?"Ẩn":"Hiện";
};

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const btn=$("loginBtn");
 const msg=$("message");

 btn.disabled=true;
 msg.style.color="#07549a";
 msg.textContent="Đang xác thực tài khoản...";

 try{
  await signInWithEmailAndPassword(
   auth,
   $("email").value.trim(),
   $("password").value
  );
  msg.style.color="#15803d";
  msg.textContent="Đăng nhập thành công!";
 }catch(error){
  msg.style.color="#c52c3a";
  msg.textContent=
   error.code==="auth/unauthorized-domain"
   ?"Tên miền chưa được cho phép trong Firebase."
   :"Đăng nhập thất bại. Kiểm tra email và mật khẩu.";
 }finally{
  btn.disabled=false;
  $("password").value="";
 }
});
</script>
</body>
</html>
