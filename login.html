<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập - Én Việt Group</title><link rel="stylesheet" href="style.css"></head><body>
<main class="page login"><h1 class="main-heading">CỔNG THANH TOÁN TRỰC TUYẾN</h1><div class="brand">ÉN VIỆT <b>GROUP</b></div><h2>Đăng nhập</h2><p class="subheading">Dành cho tài khoản quản trị được cấp quyền</p>
<form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="primary" style="width:100%" type="submit">ĐĂNG NHẬP</button></form><p id="msg" class="status" role="status"></p></main>
<script type="module">
import{auth,authReady,adminUser}from'./shared.js';import{signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const msg=document.getElementById('msg'),btn=document.getElementById('loginBtn');const u=await authReady();if(adminUser(u))location.replace('phieu.html');document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Đang xác thực...';msg.className='status';try{const r=await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('password').value);if(!adminUser(r.user)){await auth.signOut();throw Error('Tài khoản không có quyền quản trị')}location.replace('phieu.html')}catch(err){msg.textContent=err.message==='Tài khoản không có quyền quản trị'?err.message:'Sai thông tin đăng nhập, chưa cấp quyền hoặc lỗi kết nối.';msg.className='status error'}finally{btn.disabled=false}};
</script></body></html>
