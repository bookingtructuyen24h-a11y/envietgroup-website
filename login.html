
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập quản trị | Én Việt Group</title>
<style>
:root{
 --blue:#07549a;
 --orange:#ff840c;
 --navy:#0c3569;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
 font:15px Arial,Helvetica,sans-serif;
 color:var(--navy);
 background:#176bb0;
}
.scene{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:flex-end;
 padding:35px clamp(18px,6vw,100px);
 background:url('./nen_sanbay_enviet_moi.jpg')
 center center/cover no-repeat;
 isolation:isolate;
}
.panel{
 width:min(100%,402px);
 padding:30px 32px 26px;
 background:rgba(255,255,255,.97);
 box-shadow:0 20px 65px #002d5b50;
 border:1px solid #ffffffc9;
 border-radius:21px;
 text-align:center;
}
.bird{
 width:88px;
 height:68px;
 margin:0 auto 4px;
 display:block;
}
.logo{
 font-weight:850;
 font-size:27px;
 line-height:1.25;
 margin:5px 0;
 color:var(--blue);
 animation:brandGlow 4s ease-in-out infinite;
}
.logo span{color:var(--orange)}
.subtitle{
 font-size:11px;
 letter-spacing:2px;
 font-weight:700;
 margin:11px 0 17px;
 color:#254d80;
 animation:softGlow 5s ease-in-out infinite;
}
.rule{
 width:65px;
 height:3px;
 border-radius:4px;
 background:var(--orange);
 margin:0 auto 22px;
}
h1{font-size:22px;margin:0 0 24px}
input{
 display:block;
 width:100%;
 height:52px;
 border:1px solid #cbd8e4;
 border-radius:9px;
 background:#fff;
 padding:0 15px;
 margin-bottom:13px;
 font-size:15px;
}
input:focus-visible{
 outline:2px solid #63b2ec;
 outline-offset:1px;
}
.password{position:relative}
.password input{padding-right:65px}
.show{
 position:absolute;
 right:8px;
 top:7px;
 padding:10px;
 border:0;
 background:transparent;
 color:#486987;
 cursor:pointer;
}
.login{
 display:block;
 width:100%;
 padding:16px;
 border:0;
 border-radius:9px;
 background:linear-gradient(90deg,#ff980b,#f85b04);
 color:#fff;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
 animation:buttonGlow 3.5s ease-in-out infinite;
}
.login:disabled{opacity:.7;cursor:wait}
#message{
 min-height:20px;
 font-size:13px;
 line-height:1.5;
 margin:16px 0 10px;
}
.note{
 border-top:1px solid #dce5ed;
 padding-top:15px;
 margin-top:14px;
 font-size:12px;
 color:#6e8190;
}

/* Hiệu ứng phát sáng chữ */
@keyframes brandGlow{
 0%,100%{
  text-shadow:none;
  filter:brightness(1);
 }
 50%{
  text-shadow:
   0 0 9px #82cdfc60,
   0 0 11px #ffb36650;
  filter:brightness(1.07);
 }
}

/* Hiệu ứng tiêu đề */
@keyframes softGlow{
 0%,100%{opacity:.75}
 50%{
  opacity:1;
  text-shadow:0 0 6px #69aaf5a6;
 }
}

/* Hiệu ứng nút đăng nhập */
@keyframes buttonGlow{
 0%,100%{
  box-shadow:0 4px 10px #ff8b003b;
  filter:brightness(1);
 }
 50%{
  box-shadow:0 0 20px #ff90008e;
  filter:brightness(1.08);
 }
}

@media(max-width:700px){
 .scene{
  justify-content:center;
  padding:24px 15px;
  background-position:36% center;
 }
 .panel{
  width:min(100%,390px);
  padding:25px 22px;
 }
}
@media(prefers-reduced-motion:reduce){
 .logo,.subtitle,.login{animation:none}
}
</style>
</head>
<body>

<div class="scene">
<main class="panel">

<svg class="bird" viewBox="0 0 120 90"
role="img" aria-label="Biểu tượng cánh én cách điệu">
<path fill="#ff8608"
d="M7 11 Q40 32 73 44
Q49 46 30 32
Q47 53 73 54
Q48 60 30 49
Q48 69 77 64
Q43 77 25 59
Q53 87 84 65"/>
<path fill="#0666b8"
d="M73 44 Q93 30 108 43
Q113 48 116 45
Q112 55 103 54
Q92 83 46 83
Q79 70 73 44Z"/>
</svg>

<div class="logo">
ÉN VIỆT <span>GROUP</span>
</div>

<p class="subtitle">
CỔNG THANH TOÁN TRỰC TUYẾN
</p>

<div class="rule"></div>

<h1>Đăng nhập quản trị</h1>

<form id="loginForm">

<input id="email"
type="email"
placeholder="Email"
autocomplete="username"
aria-label="Email"
required>

<div class="password">
<input id="password"
type="password"
placeholder="Mật khẩu"
autocomplete="current-password"
aria-label="Mật khẩu"
required>

<button class="show"
type="button"
id="showPassword">
Hiện
</button>
</div>

<button class="login"
id="loginBtn"
type="submit">
ĐĂNG NHẬP →
</button>

</form>

<p id="message" role="status"
aria-live="polite"></p>

<div class="note">
Chỉ dành cho nhân viên được cấp quyền
</div>

</main>
</div>

<script type="module">

import {initializeApp} from
'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';

import {
 getAuth,
 signInWithEmailAndPassword
} from
'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const config={
 apiKey:'AIzaSyDCbesOqPohbh8R5N42l7z6h3T8Coipa8o',
 authDomain:'enviet-payment-center.firebaseapp.com',
 projectId:'enviet-payment-center',
 storageBucket:'enviet-payment-center.firebasestorage.app',
 messagingSenderId:'995803196860',
 appId:'1:995803196860:web:623863bdf426b079ac0fb9',
 measurementId:'G-2DVDS6V976'
};

const auth=getAuth(initializeApp(config));
const $=id=>document.getElementById(id);

$('showPassword').addEventListener('click',()=>{
 const p=$('password');
 const visible=p.type==='password';
 p.type=visible?'text':'password';
 $('showPassword').textContent=visible?'Ẩn':'Hiện';
});

$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();

 const btn=$('loginBtn');
 const msg=$('message');

 btn.disabled=true;
 msg.style.color='#07549a';
 msg.textContent='Đang xác thực tài khoản...';

 try{
  await signInWithEmailAndPassword(
   auth,
   $('email').value.trim(),
   $('password').value
  );

  msg.style.color='#15803d';
  msg.textContent='Đăng nhập thành công!';

 }catch(err){
  msg.style.color='#bd2940';

  msg.textContent=
   err.code==='auth/unauthorized-domain'
   ?'Tên miền chưa được cho phép trong Firebase.'
   :'Đăng nhập thất bại. Kiểm tra email và mật khẩu.';

 }finally{
  btn.disabled=false;
  $('password').value='';
 }
});
</script>
</body>
</html>
