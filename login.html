
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Én Việt Group | Đăng nhập quản trị</title>
<style>
:root{
 --blue:#0562bb;
 --orange:#ff8008;
 --navy:#0b3267;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
 font-family:Arial,Helvetica,sans-serif;
 background:#115bab;
 color:var(--navy);
}
.scene{
 position:relative;
 min-height:100vh;
 background:url('./nen_enviet_sanbay_lien_mach.jpg')
 center center/100% 100% no-repeat;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:flex-end;
 padding:128px 6% 36px;
}
.headline{
 position:absolute;
 top:20px;
 left:2.5%;
 right:2.5%;
 z-index:2;
 text-align:center;
 color:#fff;
 font-size:clamp(20px,2.45vw,43px);
 font-weight:900;
 letter-spacing:.2px;
 line-height:1.3;
 white-space:nowrap;
 text-shadow:0 2px 5px #00477e,0 0 8px #39a2fb;
 animation:glowText 4s ease-in-out infinite;
}
.headline .orange{
 color:#ff9d2d;
 text-shadow:0 1px 4px #713012,0 0 13px #ffc66e;
}
.lightline{
 position:absolute;
 top:100px;
 left:6%;
 right:6%;
 height:3px;
 border-radius:30px;
 background:linear-gradient(90deg,
 transparent,#fff5b4,#ff8d0d,#fff,#ff8d0d);
 z-index:2;
 box-shadow:0 0 8px #ffb83f;
 overflow:hidden;
}
.lightline:before{
 content:"";
 position:absolute;
 width:22%;
 height:100%;
 background:linear-gradient(90deg,transparent,white,transparent);
 animation:sweep 6s linear infinite;
}
.plane-symbol{
 position:absolute;
 right:4%;
 top:67px;
 color:#fff;
 font-size:35px;
 transform:rotate(-13deg);
 text-shadow:0 0 10px #ff8200;
}
.panel{
 position:relative;
 z-index:3;
 width:min(100%,440px);
 padding:26px 30px 29px;
 background:#fff;
 border-radius:22px;
 box-shadow:0 18px 52px #00335c56;
 text-align:center;
}
.bird{
 width:85px;
 height:65px;
 display:block;
 margin:0 auto 5px;
}
.brand{
 font-weight:900;
 color:#06569d;
 font-size:28px;
 margin:0;
}
.brand span{color:#ff7807}
.subtitle{
 font-weight:700;
 letter-spacing:2px;
 font-size:11px;
 margin:13px 0 16px;
 color:#244776;
}
.rule{
 height:3px;
 width:65px;
 margin:0 auto 22px;
 background:#ff840b;
}
h1{
 font-size:23px;
 margin:0 0 23px;
}
.entry{
 position:relative;
 margin-bottom:13px;
}
.entry input{
 display:block;
 width:100%;
 height:53px;
 border:1px solid #cddbea;
 border-radius:9px;
 background:#fff;
 padding:0 14px;
 font-size:15px;
 color:#133f70;
}
.entry input:focus{outline:2px solid #77bef4}
.entry.password input{padding-right:76px}
.toggle{
 position:absolute;
 right:9px;
 top:8px;
 padding:10px;
 color:#0a63ae;
 background:none;
 border:0;
 cursor:pointer;
}
.submit{
 display:block;
 width:100%;
 border:0;
 border-radius:9px;
 color:#fff;
 font-weight:800;
 font-size:17px;
 padding:16px;
 background:linear-gradient(90deg,#ff9908,#ff5a04);
 cursor:pointer;
 animation:glowButton 3.6s ease-in-out infinite;
}
.submit:disabled{
 opacity:.65;
 cursor:wait;
}
#message{
 min-height:23px;
 margin:16px 0 8px;
 font-size:13px;
 line-height:1.4;
}
.foot{
 border-top:1px solid #dee5eb;
 padding-top:18px;
 color:#657b94;
 font-size:12px;
}
@keyframes glowText{
 0%,100%{filter:brightness(1)}
 50%{
  filter:brightness(1.16);
  text-shadow:0 0 13px #f9faff,0 0 19px #5ac3ff;
 }
}
@keyframes sweep{
 from{left:-25%}
 to{left:110%}
}
@keyframes glowButton{
 0%,100%{box-shadow:0 3px 10px #ff8c0055}
 50%{
  box-shadow:0 0 23px #ff8c00bb;
  filter:brightness(1.08);
 }
}
@media(max-width:1100px){
 .headline{font-size:clamp(15px,2.2vw,26px)}
 .scene{background-size:cover}
 .panel{width:390px}
}
@media(max-width:720px){
 .scene{
  justify-content:center;
  align-items:center;
  padding:100px 16px 28px;
  background-position:32% center;
 }
 .headline{
  white-space:normal;
  font-size:19px;
  top:12px;
 }
 .lightline{top:85px}
 .plane-symbol{display:none}
 .panel{
  width:100%;
  max-width:400px;
  padding:25px 22px;
 }
 .brand{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
 .headline,.submit,.lightline:before{animation:none}
}
</style>
</head>
<body>
<div class="scene">

 <div class="headline">
  <span class="orange">ÉN VIỆT GROUP</span>
  – KẾT NỐI BẦU TRỜI VIỆT, VƯƠN TỚI THẾ GIỚI
 </div>

 <div class="lightline"></div>
 <span class="plane-symbol" aria-hidden="true">✈</span>

 <main class="panel">

  <svg class="bird" viewBox="0 0 120 90"
  role="img" aria-label="Chim én Én Việt">
   <path fill="#ff8608"
    d="M7 11 Q40 32 73 44 Q49 46 30 32
    Q47 53 73 54 Q48 60 30 49
    Q48 69 77 64 Q43 77 25 59
    Q53 87 84 65"/>
   <path fill="#0666b8"
    d="M73 44 Q93 30 108 43
    Q113 48 116 45 Q112 55 103 54
    Q92 83 46 83 Q79 70 73 44Z"/>
  </svg>

  <div class="brand">
   ÉN VIỆT <span>GROUP</span>
  </div>

  <div class="subtitle">
   CỔNG THANH TOÁN TRỰC TUYẾN
  </div>

  <div class="rule"></div>
  <h1>Đăng nhập quản trị</h1>

  <form id="loginForm">

   <div class="entry">
    <input id="email" type="email"
    placeholder="Email" aria-label="Email"
    autocomplete="username" required>
   </div>

   <div class="entry password">
    <input id="password" type="password"
    placeholder="Mật khẩu" aria-label="Mật khẩu"
    autocomplete="current-password" required>

    <button class="toggle" type="button"
    id="showPassword">Hiện</button>
   </div>

   <button class="submit" id="loginBtn"
   type="submit">ĐĂNG NHẬP →</button>

  </form>

  <p id="message" role="status"
  aria-live="polite"></p>

  <div class="foot">
   Chỉ dành cho nhân viên được cấp quyền
  </div>

 </main>
</div>

<script type="module">
import {initializeApp} from
'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';

import {getAuth,signInWithEmailAndPassword} from
'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const config={
 apiKey:'AIzaSyDCbesOqPohbh8R5N42l7z6h3T8Coipa8o',
 authDomain:'enviet-payment-center.firebaseapp.com',
 projectId:'enviet-payment-center',
 storageBucket:'enviet-payment-center.firebasestorage.app',
 messagingSenderId:'995803196860',
 appId:'1:995803196860:web:623863bdf426b079ac0fb9',
 measurementId:'G-2DVDS6V976'
};

const auth=getAuth(initializeApp(config));
const $=id=>document.getElementById(id);

$('showPassword').addEventListener('click',()=>{
 const p=$('password');
 const show=p.type==='password';
 p.type=show?'text':'password';
 $('showPassword').textContent=show?'Ẩn':'Hiện';
});

$('loginForm').addEventListener('submit',async event=>{
 event.preventDefault();

 const btn=$('loginBtn');
 const msg=$('message');
 btn.disabled=true;
 msg.style.color='#08659e';
 msg.textContent='Đang xác thực...';

 try{
  await signInWithEmailAndPassword(
   auth,
   $('email').value.trim(),
   $('password').value
  );
  msg.style.color='#16803b';
  msg.textContent='Đăng nhập thành công!';
 }catch(error){
  msg.style.color='#ba2637';
  msg.textContent=
   error.code==='auth/unauthorized-domain'
   ?'Tên miền chưa được cho phép trong Firebase.'
   :'Đăng nhập thất bại. Kiểm tra Email và mật khẩu.';
 }finally{
  btn.disabled=false;
  $('password').value='';
 }
});
</script>
</body>
</html>
