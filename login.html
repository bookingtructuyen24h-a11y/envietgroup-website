
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập quản trị | Én Việt Group</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
 font-family:Arial,Helvetica,sans-serif;
 background:#07538f url('./nen_dang_nhap_enviet.jpg')
 center center / cover no-repeat fixed;
 color:#123b69;
 display:grid;
 place-items:center;
 padding:24px;
}
.login-box{
 width:min(100%,440px);
 padding:34px 40px 39px;
 background:#fffffffa;
 border-radius:16px;
 box-shadow:0 20px 56px #002e5680;
 text-align:center;
}
.bird{
 width:98px;
 height:75px;
 margin:0 auto 4px;
 display:block;
}
h1{
 margin:0;
 color:#0754a0;
 font-size:31px;
 line-height:1.2;
 letter-spacing:.3px;
}
h1 span{color:#ee820c;font-weight:400}
.subtitle{
 font-size:12px;
 letter-spacing:2.3px;
 color:#325c85;
 margin:10px 0 18px;
}
.rule{
 height:2px;
 background:#f79420;
 width:54px;
 margin:0 auto 28px;
}
h2{
 font-size:21px;
 color:#092d63;
 margin:0 0 24px;
}
input{
 display:block;
 width:100%;
 height:53px;
 border:1px solid #cddbe9;
 border-radius:9px;
 margin:0 0 15px;
 padding:0 16px;
 font-size:15px;
 background:#fff;
}
input:focus{
 outline:2px solid #8ec7ed;
 outline-offset:1px;
}
button{
 width:100%;
 border:0;
 background:linear-gradient(90deg,#08479e,#0874d8);
 color:white;
 font-size:16px;
 font-weight:700;
 padding:17px;
 cursor:pointer;
 border-radius:9px;
 margin-top:5px;
}
button:disabled{opacity:.7;cursor:wait}
#message{
 font-size:14px;
 min-height:19px;
 margin:18px 0 0;
 line-height:1.5;
}
.note{
 font-size:11px;
 color:#697e91;
 margin-top:16px;
}
@media(max-width:580px){
 body{padding:18px;background-position:60% center}
 .login-box{padding:26px 22px}
 h1{font-size:26px}
}
</style>
</head>

<body>
<main class="login-box">

 <svg class="bird" viewBox="0 0 120 90"
 role="img" aria-label="Biểu tượng cánh én cách điệu">
  <path fill="#f68b16"
  d="M7 11 Q40 32 73 44 Q49 46 30 32 Q47 53 73 54 Q48 60 30 49 Q48 69 77 64 Q43 77 25 59 Q53 87 84 65"/>
  <path fill="#0666b8"
  d="M73 44 Q93 30 108 43 Q113 48 116 45 Q112 55 103 54 Q92 83 46 83 Q79 70 73 44Z"/>
 </svg>

 <h1>ÉN VIỆT <span>GROUP</span></h1>

 <div class="subtitle">
 CỔNG THANH TOÁN TRỰC TUYẾN
 </div>

 <div class="rule"></div>

 <h2>Đăng nhập quản trị</h2>

 <form id="loginForm">
  <input
   id="email"
   type="email"
   placeholder="Email"
   aria-label="Email"
   autocomplete="username"
   required
  >

  <input
   id="password"
   type="password"
   placeholder="Mật khẩu"
   aria-label="Mật khẩu"
   autocomplete="current-password"
   required
  >

  <button id="loginBtn" type="submit">
   ĐĂNG NHẬP →
  </button>
 </form>

 <p id="message" role="status"></p>

 <div class="note">
 © 2026 Én Việt Group · Dành cho nhân viên được cấp quyền
 </div>

</main>

<script type="module">

import {initializeApp} from
'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';

import {
 getAuth,
 signInWithEmailAndPassword
} from
'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const firebaseConfig={
 apiKey:'AIzaSyDCbesOqPohbh8R5N42l7z6h3T8Coipa8o',
 authDomain:'enviet-payment-center.firebaseapp.com',
 projectId:'enviet-payment-center',
 storageBucket:'enviet-payment-center.firebasestorage.app',
 messagingSenderId:'995803196860',
 appId:'1:995803196860:web:623863bdf426b079ac0fb9',
 measurementId:'G-2DVDS6V976'
};

const auth=getAuth(initializeApp(firebaseConfig));

const form=document.getElementById('loginForm');
const btn=document.getElementById('loginBtn');
const msg=document.getElementById('message');

form.addEventListener('submit',async e=>{
 e.preventDefault();

 btn.disabled=true;
 msg.style.color='#175b94';
 msg.textContent='Đang xác thực...';

 try{
  await signInWithEmailAndPassword(
   auth,
   document.getElementById('email').value.trim(),
   document.getElementById('password').value
  );

  msg.style.color='#15803d';
  msg.textContent='Đăng nhập thành công!';

  // Chỉ chuyển đến trang quản trị
  // sau khi thiết lập phân quyền an toàn.

 }catch(err){

  msg.style.color='#ba2637';

  msg.textContent=
   err.code==='auth/unauthorized-domain'
   ? 'Tên miền chưa được cấp quyền trong Firebase.'
   : 'Đăng nhập thất bại. Kiểm tra email, mật khẩu và cấu hình Firebase.';

 }finally{
  btn.disabled=false;
  document.getElementById('password').value='';
 }

});
</script>

</body>
</html>
