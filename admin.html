<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị Én Việt Group</title><link rel="stylesheet" href="style.css"></head><body><main class="page wide"><h1 class="main-heading">QUẢN TRỊ RIÊNG</h1><div class="brand">ÉN VIỆT <b>GROUP</b></div><p class="muted">Chỉ tài khoản quản trị được phép quản lý phiếu. Khách chỉ xem qua link riêng đã xuất bản.</p><div class="toolbar"><button class="primary" id="create">+ Tạo hóa đơn mới</button><button class="secondary" id="refresh">Làm mới danh sách</button><button class="secondary" id="logout">Đăng xuất</button></div><p id="msg" class="status"></p><div id="list"></div></main><script type="module">
import{auth,authReady,adminUser,$,collectionRef,query,orderBy,getDocs,signOut,formatAmount,invoiceRef,deleteDoc,toast}from'./shared.js';
const u=await authReady();if(!adminUser(u)){location.replace('login.html')}else{load()}
$('create').onclick=()=>location.href='phieu.html';$('refresh').onclick=load;$('logout').onclick=async()=>{await signOut(auth);location.replace('login.html')};
async function load(){$('msg').textContent='Đang tải danh sách...';$('list').replaceChildren();try{const docs=await getDocs(query(collectionRef(),orderBy('createdAt','desc')));$('msg').textContent='Tổng số phiếu: '+docs.size;docs.forEach(s=>{const p=s.data();const wrap=document.createElement('div');wrap.className='row';const data=document.createElement('div');const n=document.createElement('strong');n.textContent=p.holder||'Không có tên';const amt=document.createElement('p');amt.className='muted';amt.textContent=formatAmount(p.amount)+' · '+(p.bank||'')+' · '+(p.memo||'');data.append(n,amt);const acts=document.createElement('div');const a=document.createElement('a');a.href='phieu.html?id='+encodeURIComponent(s.id);a.textContent='Mở phiếu';a.style.display='inline-block';a.style.marginBottom='8px';const copy=document.createElement('button');copy.className='secondary';copy.textContent='Copy link';copy.onclick=()=>navigator.clipboard.writeText(new URL(a.getAttribute('href'),location.href).href).then(()=>{copy.textContent='Đã copy'}).catch(()=>alert('Không thể copy'));const del=document.createElement('button');del.className='secondary';del.textContent='Xóa';del.style.marginLeft='5px';del.onclick=async()=>{if(!confirm('Xóa phiếu này? Link khách sẽ không còn mở được.'))return;try{await deleteDoc(invoiceRef(s.id));load()}catch(e){alert('Không xóa được: '+e.message)}};acts.append(a,document.createElement('br'),copy,del);wrap.append(data,acts);$('list').append(wrap)})}catch(e){$('msg').textContent='Không tải được danh sách. Kiểm tra Firestore và quyền quản trị: '+e.message;$('msg').className='status error'}}
</script></body></html>
